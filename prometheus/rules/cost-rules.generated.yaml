# GERADO AUTOMATICAMENTE por policy-compiler/compile.py — NÃO EDITE À MÃO.
# policy.version=7825d426c7ca  cost_per_gb_hot=0.5  cost_per_gb_warm=0.023

groups:
- name: otel-cost-governance
  interval: 30s
  rules:
  - record: policy:volume_gb:by_service_tier
    expr: "(\n    logs_count_by_service_total * 256\n  + spans_count_by_service_total * 512\n  + datapoints_count_by_service_total\
      \ * 64\n) / 1e9"
  - record: policy:volume_gb:by_service
    expr: sum by (service_name) (policy:volume_gb:by_service_tier)
  - record: cost:downgrade_saving_usd:by_service
    expr: policy:volume_gb:by_service_tier{telemetry_tier="warm"} * (0.5 - 0.023)
  - record: cost:drop_saving_usd:by_service
    expr: policy:volume_gb:by_service_tier{telemetry_tier="drop"} * 0.5
  - record: cost:residual_usd:by_service_tier
    expr: "(policy:volume_gb:by_service_tier{telemetry_tier=\"hot\"} * 0.5)\n  or (policy:volume_gb:by_service_tier{telemetry_tier=\"\
      warm\"} * 0.023)"
  - record: policy:over_budget:by_service
    expr: policy:volume_gb:by_service{service_name="checkout-api"} > bool 5
  - record: policy:over_budget:by_service
    expr: policy:volume_gb:by_service{service_name="payment-gateway"} > bool 3
  - record: policy:over_budget:by_service
    expr: policy:volume_gb:by_service{service_name="auth-service"} > bool 2
  - record: policy:over_budget:by_service
    expr: policy:volume_gb:by_service{service_name="inventory-service"} > bool 4
  - record: policy:over_budget:by_service
    expr: policy:volume_gb:by_service{service_name="frontend-bff"} > bool 6
  - record: policy:over_budget:by_service
    expr: policy:volume_gb:by_service{service_name="notification-worker"} > bool 2
  - record: policy:over_budget:by_service
    expr: policy:volume_gb:by_service{service_name="recommendation-engine"} > bool 1.5
  - record: policy:over_budget:by_service
    expr: policy:volume_gb:by_service{service_name="batch-etl-job"} > bool 1
