services:
  # --- Warm tier (S3-compatible local) -------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-otelgw}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-otelgw-warm-tier}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-01-13T08-44-48Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-otelgw}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-otelgw-warm-tier}
      MINIO_BUCKET: ${MINIO_BUCKET:-warm-tier}
    entrypoint: ["/bin/sh", "/init/create-buckets.sh"]
    volumes:
      - ./minio/init:/init:ro

  # --- Hot tier (open-source Grafana stack) ---------------------------------
  loki:
    image: grafana/loki:3.0.0
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.4.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  prometheus:
    image: prom/prometheus:v2.51.2
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=expand-external-labels
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/etc/grafana/provisioning/dashboards/json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  # --- Gateway Collector (routing by value) ---------------------------------
  otel-gateway-collector:
    image: otel/opentelemetry-collector-contrib:0.102.1
    command: ["--config=/etc/otelcol/otelcol-config.generated.yaml"]
    volumes:
      - ./collector/config/otelcol-config.generated.yaml:/etc/otelcol/otelcol-config.generated.yaml:ro
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-otelgw}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-otelgw-warm-tier}
    ports:
      - "4317:4317"   # OTLP gRPC (receives from telemetry-generator / Agent Collectors)
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # self-telemetry (the Collector's own metrics)
      - "8889:8889"   # business metrics (count connectors -> prometheus/self)
      - "13133:13133" # health_check extension
    depends_on:
      minio-init:
        condition: service_completed_successfully
      loki:
        condition: service_started
      tempo:
        condition: service_started

  # --- Synthetic load ---------------------------------------------------------
  telemetry-generator:
    build: ./telemetry-generator
    environment:
      OTLP_ENDPOINT: otel-gateway-collector:4317
    volumes:
      - ./telemetry-generator/services.yaml:/app/services.yaml:ro
    depends_on:
      - otel-gateway-collector
    profiles: ["load"]   # only comes up on demand via `make load`, not on plain `up`

volumes:
  minio-data:
  loki-data:
  tempo-data:
  prometheus-data:
